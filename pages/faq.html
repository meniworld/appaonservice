<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact Us</title>
    <link rel="stylesheet" href="../assets/styles/common.css">
    <link rel="stylesheet" href="../assets/styles/common-form.css">
    <link rel="stylesheet" href="../assets/styles/contact.css">
    <link rel="stylesheet" href="../assets/styles/faq.css">
</head>

<body>

    <section class="faq-section">
        <div class="container">
            <h2 class="faq-title">Frequently Asked Questions</h2>
            <div class="faq-list">
                <div class="faq-item">
                    <button class="faq-question">What is your return policy?</button>
                    <div class="faq-answer">
                        <p>We accept returns within 30 days. The product must be unused and in original packaging.</p>
                    </div>
                </div>
                <div class="faq-item">
                    <button class="faq-question">How do I track my order?</button>
                    <div class="faq-answer">
                        <p>After placing the order, you'll receive a tracking link via email or SMS.</p>
                    </div>
                </div>
                <div class="faq-item">
                    <button class="faq-question">Do you ship internationally?</button>
                    <div class="faq-answer">
                        <p>Yes, we offer international shipping to selected countries. Extra charges may apply.</p>
                    </div>
                </div>
            </div>
        </div>
    </section>
    <script src="../assets/scripts/faq.js"></script>
</body>

</html>
